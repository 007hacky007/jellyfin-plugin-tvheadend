imageUrl: "https://repo.jellyfin.org/releases/plugin/images/jellyfin-plugin-tvheadend.png"
version: 15.1.3
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "007hacky007"
overview: "TVHeadend plugin fork that fails fast when the server is unreachable"
description: "Provides live TV using TVHeadend as the source. Fork of the official plugin that stays responsive when the TVHeadend server is unreachable."
category: "LiveTV"
artifacts:
  - "TVHeadEnd.dll"
changelog: |-
  - Every operation that reads or changes TVHeadend state now fails while the server is unavailable instead of returning an empty list or a silent success: Jellyfin no longer deletes recordings from its library during an outage, and a timer or recording change that TVHeadend rejected or did not answer is reported as an error instead of appearing to succeed
  - The metadata snapshot is rebuilt from the server's dump on every reconnect, so recordings deleted or finished during an outage no longer keep their old state until a restart
  - Playback tickets, including cached ones, wait for a reconnect instead of handing Jellyfin a stream URL that fails later
  - Rework the connection lifecycle after upstream review: one background loop owns each connection, stale callbacks cannot affect a replacement connection, and shutdown or connection loss wakes every pending request
  - A brief TVHeadend restart is now invisible: the reconnect is immediate and callers wait for it; retries against a server that is really down never block the UI
  - Rejected credentials are retried once the server, username or password in the configuration change (no restart needed); a stalled initial sync or a server that stopped answering triggers a reconnect
  - Playback right after a TVHeadend restart waits for the reconnect instead of failing; the configuration is re-read on every reconnect attempt
  - Fix a guide refresh while TVHeadend is unreachable deleting all channels and EPG data from Jellyfin: the plugin now reports an error instead of an empty channel list, so existing data is kept
  - Rejected credentials stop the reconnect loop for good, with a clear error in the log (unreachable servers keep being retried with backoff)
  - A connection closed by the server is rebuilt on the next call; keepalive tuning failures no longer prevent connecting; the reconnect loop stops when the plugin is unloaded
  - Channels without a channel number (TVHeadend reports 0) are no longer dropped; option "Include channels without a channel number" (default on) restores the old behaviour when unchecked
  - Configuration page uses the fork's plugin GUID and reports load/save errors instead of spinning silently
  - Rebased on the official plugin version 15: Jellyfin 12 support, HTSP handling fixes across TVHeadend versions, series timers via autorec entries, web root taken from the server
  - Fail fast when the TVH server is unreachable: connection runs in a background loop with a 10s connect timeout and exponential backoff, UI requests never block on a dead server
  - TCP keepalive detects a silently dead peer (e.g. VPN link down) within ~90s
